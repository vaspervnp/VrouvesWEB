<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- the GamePix SDK, before the game: the game says itself when it has loaded and started -->
		<script>
window.GamePixConfig = { lifecycle: 'manual' };
		</script>
		<script src="https://integration.gamepix.com/sdk/v3/gamepix.sdk.js"></script>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	color: white;
	background-color: #1a1f1a;
	overflow: hidden;
	touch-action: none;
	-ms-touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	background: #78cc59 url(loading.jpg) center / cover no-repeat;
	font-family: 'Trebuchet MS', Arial, sans-serif;
	visibility: hidden;
}

#status-box {
	position: absolute;
	left: 50%;
	bottom: 8%;
	transform: translateX(-50%);
	width: min(70%, 520px);
	text-align: center;
}

#status-bar {
	height: 22px;
	border: 3px solid #ffd933;
	border-radius: 14px;
	background: rgba(12, 16, 30, 0.75);
	overflow: hidden;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
}

#status-fill {
	height: 100%;
	width: 0%;
	background: linear-gradient(#ff8a70, #d23b23);
	transition: width 0.2s;
}

#status-notice {
	display: none;
	margin: 0 2rem;
	padding: 1rem;
	border-radius: 0.5rem;
	background-color: #5b3943;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.3;
	text-align: center;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="status-box"><div id="status-bar"><div id="status-fill"></div></div></div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusBox = document.getElementById('status-box');
	const statusFill = document.getElementById('status-fill');
	const statusNotice = document.getElementById('status-notice');
	const gpx = window.GamePix;
	let shown = -1;

	function progress(pct) {
		pct = Math.max(shown, Math.min(100, Math.floor(pct)));
		if (pct === shown) {
			return;
		}
		shown = pct;
		statusFill.style.width = pct + '%';
		if (gpx) {
			gpx.lifecycle.loading(pct);
		}
	}

	function displayFailureNotice(err) {
		console.error(err);
		statusBox.style.display = 'none';
		statusNotice.textContent = err instanceof Error ? err.message : String(err);
		statusNotice.style.display = 'block';
	}

	const missing = Engine.getMissingFeatures({ threads: false });
	statusOverlay.style.visibility = 'visible';
	if (missing.length !== 0) {
		displayFailureNotice('This browser is missing: ' + missing.join(', '));
		return;
	}
	progress(0);
	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				// the last few percent are the engine starting up
				progress(current / total * 95);
			}
		},
	}).then(() => {
		progress(100);
		statusOverlay.remove();
	}, displayFailureNotice);
}());
		</script>
	</body>
</html>
